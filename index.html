<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say Game</title>
    <link rel="stylesheet" href="simon.css">
</head>

<body>
    <header class="top">
        <h1>Simon Say</h1>
        <div class="controls">
            <div class="score">
                <div class="label">Level</div>
                <div id="level">0</div>
            </div>
            <button id="start" aria-pressed="false">Start</button>
            <div class="highscore">
                <div class="label">Highest</div>
                <div id="highS">0</div>
            </div>
        </div>
    </header>

    <main>
        <section class="board" role="application" aria-label="Simon game buttons">
            <button class="pad red" id="red" aria-label="red pad"></button>
            <button class="pad blue" id="blue" aria-label="blue pad"></button>
            <button class="pad green" id="green" aria-label="green pad"></button>
            <button class="pad yellow" id="yellow" aria-label="yellow pad"></button>
        </section>
    </main>

    <footer class="hint">Click Start or press any key to begin. Repeat the sequence to level up.</footer>

    <script src="simon.js"></script>
</body>

</html>
